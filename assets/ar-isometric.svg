<svg xmlns="http://www.w3.org/2000/svg" viewBox="85 0 430 360" fill="none" role="img" aria-labelledby="title desc"><title id="title">PN junction in augmented reality</title><desc id="desc">An isometric phone displays a PN junction simulation while the same three-dimensional junction floats over a marker card. Dashed projection lines connect the phone to the augmented model.</desc><style>
  .ar-junction { animation: ar-hover 6.5s ease-in-out infinite; }
  .ar-projection { animation: ar-signal 4s linear infinite, ar-hover 6.5s ease-in-out infinite; }
  .ar-phone-model { animation: ar-screen-hover 6.5s ease-in-out infinite; }
  @keyframes ar-hover { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
  @keyframes ar-screen-hover { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-1.5px); } }
  @keyframes ar-signal { to { stroke-dashoffset: -40; } }
  @media (prefers-reduced-motion: reduce) {
    .ar-junction, .ar-projection, .ar-phone-model { animation: none; }
  }
</style><g stroke-linejoin="round" stroke-linecap="round">
